
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: dev
  labels:
    app: gateway-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-app
  template:
    metadata:
      labels:
        app: gateway-app
    spec:
      containers:
        - name: gateway-service
          image: gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: APP_ENV
              value: "development"
            - name: PORT
              value: "3001"
            - name: AUTH_URL
              value: "http://auth-service:3002"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3005"
            - name: PRODUCTS_URL
              value: "http://product-service:3003"
            - name: USER_SERVICE_URL
              value: "http://user-service:3005"


---

apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: dev
  labels:
    app: gateway-app
spec:
  type: ClusterIP
  selector:
    app: gateway-app
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  